name: CI Pipeline (Lint and Build Vite Application)

run-name: CI - ${{ github.ref_name }} by ${{ github.actor }}

on:
    push:
        branches:
            - main

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint

    build:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build
